[package]
name = "openkakao-cli"
version = "1.7.1"
edition = "2021"
description = "KakaoTalk CLI for macOS — send/read messages without server login via Accessibility automation"
license = "MIT"

[features]
default = []
windows-ui-write = []

[[bin]]
name = "openkakao-cli"
path = "src/main.rs"

[lib]
name = "openkakao_cli"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
base64 = "0.22"
bson = "2.13"
byteorder = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
csv = "1.3"
dirs = "6.0"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
plist = "1.7"
rand = "0.8"
rpassword = "7"
sha1 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "brotli", "deflate", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.18"
thiserror = "2.0"
time = "=0.3.36"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
owo-colors = "4"
urlencoding = "2.1"
webpki-roots = "0.26"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

# AX automation (local-send/ax-read) links Apple-only frameworks and fails to
# even compile on other platforms — see src/ax_send.rs's cfg(not(macos)) stub.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan"] }
rusqlite = { version = "0.33", features = ["bundled-sqlcipher"] }

# Non-macOS builds still use rusqlite for openkakao-cli's own local cache,
# but must not compile or link the macOS-only SQLCipher/KakaoTalk DB path.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
