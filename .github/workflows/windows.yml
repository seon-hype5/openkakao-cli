name: Windows safe CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - "scripts/build-windows-authenticode-fixture.ps1"
      - "scripts/qualify-windows-trust-assumptions.ps1"
      - ".github/workflows/windows.yml"
      - ".github/workflows/openkakao-cli-ci.yml"
      - "docs/windows-port/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - "scripts/build-windows-authenticode-fixture.ps1"
      - "scripts/qualify-windows-trust-assumptions.ps1"
      - ".github/workflows/windows.yml"
      - ".github/workflows/openkakao-cli-ci.yml"
      - "docs/windows-port/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-safe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: .target/windows-ci
  RUST_BACKTRACE: "0"

jobs:
  safe-windows:
    name: fmt, clippy, synthetic tests, build
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Windows documentation and CI pins
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $repositoryRoot = (Get-Location).Path
          $repositoryPrefix = $repositoryRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar) +
            [System.IO.Path]::DirectorySeparatorChar
          $documentationRoot = Join-Path $repositoryRoot "docs/windows-port"
          $workflowPaths = @(
            (Join-Path $repositoryRoot ".github/workflows/windows.yml"),
            (Join-Path $repositoryRoot ".github/workflows/openkakao-cli-ci.yml")
          )
          $toolchainPath = Join-Path $repositoryRoot "rust-toolchain.toml"
          $markdownFiles = @(Get-ChildItem -LiteralPath $documentationRoot -Recurse -File -Filter "*.md")
          $brokenLinks = [System.Collections.Generic.List[string]]::new()
          $localLinkCount = 0

          foreach ($file in $markdownFiles) {
            $contents = Get-Content -LiteralPath $file.FullName -Raw
            $links = [regex]::Matches($contents, '\[[^\]]*\]\((?<target>[^)]+)\)')
            foreach ($link in $links) {
              $target = $link.Groups["target"].Value.Trim().Trim('<', '>')
              if ($target -match '^(?i:https?://|mailto:|#)') {
                continue
              }
              $pathPart = ($target -split '#', 2)[0]
              if ([string]::IsNullOrWhiteSpace($pathPart)) {
                continue
              }
              $localLinkCount++
              $decodedPath = [uri]::UnescapeDataString($pathPart)
              $resolvedPath = [System.IO.Path]::GetFullPath((Join-Path $file.DirectoryName $decodedPath))
              if (-not $resolvedPath.StartsWith($repositoryPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
                -not (Test-Path -LiteralPath $resolvedPath)) {
                $relativeFile = [System.IO.Path]::GetRelativePath($repositoryRoot, $file.FullName)
                $brokenLinks.Add("${relativeFile}: ${target}")
              }
            }
          }
          if ($brokenLinks.Count -ne 0) {
            throw "broken or out-of-repository local links: $($brokenLinks -join '; ')"
          }

          $thirdPartyActionCount = 0
          foreach ($workflowPath in $workflowPaths) {
            foreach ($line in Get-Content -LiteralPath $workflowPath) {
              if ($line -notmatch '^\s*uses:\s*(?<reference>\S+)') {
                continue
              }
              $actionReference = $Matches["reference"]
              if ($actionReference.StartsWith("./", [System.StringComparison]::Ordinal)) {
                continue
              }
              $thirdPartyActionCount++
              if ($actionReference -notmatch '^[^@\s]+@[0-9a-f]{40}$') {
                $relativeWorkflow = [System.IO.Path]::GetRelativePath($repositoryRoot, $workflowPath)
                throw "mutable third-party action reference in ${relativeWorkflow}"
              }
            }
          }
          if ($thirdPartyActionCount -eq 0) {
            throw "no third-party action references found"
          }

          $toolchainPinned = Select-String -LiteralPath $toolchainPath -Pattern '^channel = "1\.95\.0"$' -Quiet
          if (-not $toolchainPinned) {
            throw "rust-toolchain.toml must pin channel 1.95.0"
          }
          Write-Output (
            "windows_port_markdown_files={0} local_links={1} broken=0 action_refs={2} pinned={2}" -f
              $markdownFiles.Count,
              $localLinkCount,
              $thirdPartyActionCount
          )

      - name: Qualify Windows strong-sign and NTFS process-image assumptions
        shell: pwsh
        run: ./scripts/qualify-windows-trust-assumptions.ps1

      - name: Install pinned repository toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          rustflags: ""
          cache: false

      - name: Verify repository toolchain pin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = Select-String -Path rust-toolchain.toml -Pattern '^channel = "1\.95\.0"$'
          if (-not $pin) {
            throw "rust-toolchain.toml must pin channel 1.95.0"
          }
          $version = (& rustc --version).Trim()
          if ($version -notmatch '^rustc 1\.95\.0 ') {
            throw "unexpected rustc version"
          }

      - name: Cache compiler inputs and outputs only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .target/windows-ci
          key: windows-safe-rust-1.95.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-safe-rust-1.95.0-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint every Windows target
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run synthetic library tests
        run: cargo test --locked --lib

      - name: Run feature-gated Windows transaction tests
        run: cargo test --locked --lib --all-features platform::windows

      - name: Run synthetic binary unit tests
        run: cargo test --locked --bin openkakao-cli

      - name: Run Windows fake and contract tests
        run: cargo test --locked --test windows_backend --test windows_policy --test windows_cli

      - name: Run feature-gated Windows backend contract tests
        run: cargo test --locked --all-features --test windows_backend

      - name: Run synthetic compatibility suites
        run: cargo test --locked --test auth_flow_test --test loco_client_test --test loco_crypto_test --test loco_packet_test --test message_db_test

      - name: Run safe CLI compatibility selection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $safeTests = @(
            "help_exits_zero",
            "help_lists_expected_subcommands",
            "version_prints_correct_version",
            "invalid_subcommand_exits_nonzero",
            "send_without_args_fails",
            "read_without_chat_id_fails",
            "json_flag_is_global",
            "no_color_flag_is_global",
            "watch_accepts_capture_flag",
            "probe_accepts_capture_pushes_flag",
            "delete_help_works",
            "delete_without_args_fails",
            "mark_read_help_works",
            "mark_read_without_args_fails"
          )
          foreach ($testName in $safeTests) {
            & cargo test --locked --test cli_test $testName -- --exact
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build Windows debug binary
        run: cargo build --locked

      - name: Build feature-gated Windows debug binary
        run: cargo build --locked --all-features

      - name: Build Windows release binary
        run: cargo build --locked --release

      - name: Build feature-gated Windows release binary
        run: cargo build --locked --release --all-features

      - name: Run release feature-gated Windows tests
        run: cargo test --locked --release --all-features --lib platform::windows

      # Deliberately no upload-artifact step. The workflow never invokes a
      # live UI command and retains only dependency/compiler caches.
